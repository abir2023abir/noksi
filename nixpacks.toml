# Railway / Nixpacks: PHP only — skip Node/npm (OOM fix).
# Frontend assets are pre-built and committed in public/build.

providers = ["php"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.gd",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.tokenizer",
  "php83Extensions.xml",
  "php83Extensions.ctype",
  "php83Extensions.fileinfo",
  "php83Extensions.openssl",
  "php83Extensions.bcmath",
  "php83Extensions.exif",
  "php83Extensions.zip",
]

[phases.install]
cmds = [
  "composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress",
]

[phases.build]
cmds = [
  "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache || true",
  "php artisan package:discover --ansi || true",
]

[start]
cmd = "bash start.sh"
