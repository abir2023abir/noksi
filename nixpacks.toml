# Nixpacks config kept as fallback; Railway now uses Dockerfile via railway.toml.
providers = ["php"]

[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "php83Extensions.gd",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.tokenizer",
  "php83Extensions.xml",
  "php83Extensions.ctype",
  "php83Extensions.fileinfo",
  "php83Extensions.openssl",
  "php83Extensions.bcmath",
  "php83Extensions.exif",
  "php83Extensions.zip",
]

[phases.install]
cmds = [
  "composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress --no-scripts",
  "composer dump-autoload --optimize --no-dev",
]

[phases.build]
cmds = [
  "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache || true",
]

[start]
cmd = "bash start.sh"
